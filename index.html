<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>SOOVEŔ — Maison de Parfum | Official Online Boutique</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230d0b09'/><text x='16' y='21' font-family='Georgia,serif' font-size='13' fill='%23d4af37' text-anchor='middle'>SO</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ws-bg: #111318;
      --app-bg: #faf8f5;
      --surface: #ffffff;
      --ink: #14110e;
      --ink-2: #5c564f;
      --ink-3: #8c857b;
      --line: #e6e0d6;
      --line-2: #efeae2;
      --gold: #b48e55;
      --gold-dark: #8f6d38;
      --gold-soft: #e5d3b3;
      --danger: #c92a2a;
      --danger-bg: #fff5f5;
      --danger-line: #ffc9c9;
      --success: #1b7a43;
      --serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; width: 100%; overflow-x: hidden; }
    body {
      font-family: var(--sans);
      color: var(--ink);
      background: var(--app-bg);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    img { max-width: 100%; display: block; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }

    /* ---------------- Researcher Toolbar ---------------- */
    .toolbar {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 10px 16px; background: #12151b;
      border-bottom: 1px solid rgba(255,255,255,.08);
      position: sticky; top: 0; z-index: 100;
    }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand-mark {
      width: 30px; height: 30px; border-radius: 7px; background: #000; color: var(--gold-soft);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--serif); font-weight: 700; font-size: 12px;
      border: 1px solid var(--gold); flex-shrink: 0;
    }
    .brand-name { font-family: var(--serif); font-weight: 600; letter-spacing: 1.5px; font-size: 13px; color: #f4f1ec; }
    .brand-sub { font-size: 9.5px; letter-spacing: 1.2px; text-transform: uppercase; color: #f0a8a8; }
    .sync-pill {
      font-size: 10.5px; color: #6ee7b7; background: rgba(16,185,129,.12);
      border: 1px solid rgba(16,185,129,.3); padding: 3px 8px; border-radius: 20px; white-space: nowrap;
    }
    .live-pill {
      font-size: 10.5px; color: #e9cfa6; background: rgba(180,142,85,.14);
      border: 1px solid rgba(180,142,85,.35); padding: 3px 8px; border-radius: 20px; white-space: nowrap;
    }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
    .tab {
      border: 1px solid rgba(255,255,255,.14); background: transparent; color: #c7ccd4;
      padding: 6px 11px; border-radius: 8px; font-size: 11.5px; font-weight: 500; cursor: pointer;
      transition: .15s;
    }
    .tab:hover { border-color: rgba(255,255,255,.35); color: #fff; }
    .tab.active { background: #fff; color: #14110e; border-color: #fff; font-weight: 600; }
    .inspector { display: flex; align-items: center; gap: 6px; color: #c7ccd4; font-size: 11.5px; }
    .inspector-label { letter-spacing: .5px; text-transform: uppercase; font-size: 9.5px; color: #8b9099; }
    .switch { width: 40px; height: 22px; border-radius: 12px; background: #3a3f47; position: relative; cursor: pointer; transition: .2s; border: none; padding: 0; }
    .switch.on { background: var(--gold); }
    .switch .knob { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: .2s; }
    .switch.on .knob { left: 20px; }
    .inspector-state { font-weight: 600; min-width: 24px; color: #fff; }

    .task-banner {
      display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap;
      padding: 9px 14px; background: #1e222b; color: #f0ece4;
      border-bottom: 1px solid rgba(180,142,85,.35); font-size: 12.5px; text-align: center; line-height: 1.45;
    }
    .task-tag {
      font-size: 9.5px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase;
      color: #14110e; background: var(--gold-soft); padding: 3px 7px; border-radius: 4px;
    }

    /* ---------------- Dark Pattern Elements & Callouts ---------------- */
    .urgency-banner {
      display: flex; align-items: center; justify-content: center; gap: 9px;
      background: var(--danger); color: #fff;
      padding: 11px 16px; border-radius: 10px; font-size: 13px; font-weight: 600;
      margin: 20px 0 6px; letter-spacing: .2px;
      box-shadow: 0 6px 18px rgba(201,42,42,.25);
    }
    .urgency-banner b { font-family: ui-monospace, monospace; font-size: 14.5px; }
    .pulse { width: 9px; height: 9px; border-radius: 50%; background: #fff; flex-shrink: 0; animation: pulse 1.1s infinite; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255,255,255,.75); }
      70% { box-shadow: 0 0 0 8px rgba(255,255,255,0); }
      100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
    }

    .dp-callout {
      background: rgba(201,42,42,.06); border: 1px solid var(--danger-line); border-left: 4px solid var(--danger);
      border-radius: 9px; padding: 10px 13px; margin: 12px 0; font-size: 12px; line-height: 1.45; color: #7a1f1f;
      text-align: left;
    }
    .dp-tag { font-size: 9.5px; font-weight: 800; letter-spacing: 1.1px; color: var(--danger); text-transform: uppercase; }
    .dp-title { font-size: 13px; font-weight: 700; color: #9c1c1c; margin: 2px 0; }
    .dp-desc { color: #8a3a3a; }

    /* ---------------- Storefront Layout ---------------- */
    .announce-bar {
      background: #14110e; color: #e8e2d9; text-align: center;
      padding: 8px 12px; font-size: clamp(10px, 2.6vw, 11.5px); letter-spacing: 1px; text-transform: uppercase; line-height: 1.4;
    }
    .announce-bar b { color: var(--gold-soft); font-weight: 600; }

    .site-header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(250, 248, 245, 0.96); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .header-inner {
      max-width: 1180px; margin: 0 auto; padding: 12px 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }
    .site-brand {
      display: flex; align-items: center; gap: 10px; cursor: pointer; text-decoration: none; color: inherit;
    }
    .site-logo {
      width: 38px; height: 38px; border-radius: 8px; background: #14110e; color: var(--gold-soft);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--serif); font-weight: 700; font-size: 15px; letter-spacing: 1px;
      border: 1px solid var(--gold); flex-shrink: 0;
    }
    .site-name-wrap { display: flex; flex-direction: column; }
    .site-name { font-family: var(--serif); font-size: clamp(18px, 4.5vw, 22px); letter-spacing: 3px; font-weight: 700; line-height: 1.1; }
    .site-tagline { font-size: 9px; letter-spacing: 1.8px; text-transform: uppercase; color: var(--gold-dark); margin-top: 2px; }

    .site-nav { display: flex; align-items: center; gap: 18px; }
    .nav-link {
      background: none; border: none; padding: 8px 4px; font-family: var(--sans);
      font-size: 13.5px; font-weight: 500; color: var(--ink-2); cursor: pointer;
      position: relative; transition: color .15s; letter-spacing: .2px; min-height: 40px;
    }
    .nav-link:hover, .nav-link.active { color: var(--ink); font-weight: 600; }
    .nav-link.active::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: 2px;
      height: 2px; background: var(--gold);
    }
    .cart-btn {
      display: flex; align-items: center; gap: 6px;
      background: var(--ink); color: #fff; border: none;
      padding: 9px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
      cursor: pointer; transition: .15s; min-height: 40px; white-space: nowrap;
    }
    .cart-btn:hover { background: #2c2620; }
    .cart-badge {
      background: var(--gold); color: #fff; font-size: 11px; font-weight: 700;
      padding: 2px 7px; border-radius: 999px;
    }

    /* Toast Notification */
    .toast-msg {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #14110e; color: #fff; padding: 11px 20px; border-radius: 999px;
      font-size: 13px; font-weight: 600; z-index: 120; box-shadow: 0 12px 30px rgba(0,0,0,.25);
      border: 1px solid var(--gold); display: flex; align-items: center; gap: 10px; white-space: nowrap;
    }
    .toast-btn {
      background: var(--gold); color: #fff; border: none; padding: 5px 11px;
      border-radius: 999px; font-size: 11.5px; font-weight: 700; cursor: pointer;
    }

    /* ---------------- Main Container ---------------- */
    .site-main {
      max-width: 1180px; margin: 0 auto; padding: 0 20px 64px; min-height: 72vh;
    }

    /* ---------------- Home Page ---------------- */
    .hero-section {
      display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 40px; align-items: center;
      padding: 40px 0 52px; border-bottom: 1px solid var(--line);
    }
    .hero-eyebrow {
      display: inline-block; font-size: 10.5px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; color: var(--gold-dark); margin-bottom: 12px;
    }
    .hero-title {
      font-family: var(--serif); font-size: clamp(28px, 5.5vw, 52px);
      font-weight: 600; line-height: 1.14; margin: 0 0 16px; color: var(--ink);
    }
    .hero-title em { font-style: italic; font-weight: 400; color: var(--gold-dark); }
    .hero-desc {
      font-size: clamp(14px, 3.6vw, 15.5px); line-height: 1.65; color: var(--ink-2);
      margin: 0 0 24px; max-width: 520px;
    }
    .hero-actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .btn-gold {
      background: var(--ink); color: #fff; border: 1px solid var(--ink);
      padding: 14px 24px; border-radius: 10px; font-size: 14px; font-weight: 600;
      letter-spacing: .4px; cursor: pointer; transition: .18s; min-height: 48px;
    }
    .btn-gold:hover { background: var(--gold-dark); border-color: var(--gold-dark); }
    .btn-outline {
      background: transparent; color: var(--ink); border: 1px solid var(--line);
      padding: 14px 20px; border-radius: 10px; font-size: 14px; font-weight: 500;
      cursor: pointer; transition: .18s; min-height: 48px;
    }
    .btn-outline:hover { border-color: var(--ink); background: #fff; }

    .hero-stats {
      display: grid; grid-template-columns: repeat(3, auto); gap: 20px;
      margin-top: 32px; padding-top: 22px; border-top: 1px solid var(--line); justify-content: start;
    }
    .stat-num { font-family: var(--serif); font-size: clamp(17px, 4vw, 22px); font-weight: 700; color: var(--ink); }
    .stat-label { font-size: 10.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .8px; margin-top: 2px; }

    .hero-visual { position: relative; display: flex; justify-content: center; width: 100%; }
    .hero-card {
      position: relative; width: 100%; max-width: 400px; border-radius: 18px;
      overflow: hidden; background: #14110e; box-shadow: 0 24px 48px rgba(20,17,14,.16);
      border: 1px solid rgba(180,142,85,.35);
    }
    .hero-card img { width: 100%; height: clamp(280px, 65vw, 420px); object-fit: cover; display: block; }
    .hero-card-badge {
      position: absolute; bottom: 14px; left: 14px; right: 14px;
      background: rgba(20, 17, 14, 0.88); backdrop-filter: blur(10px);
      padding: 12px 16px; border-radius: 12px; color: #fff;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      border: 1px solid rgba(255,255,255,.12);
    }
    .hcb-title { font-family: var(--serif); font-size: 15px; font-weight: 600; }
    .hcb-sub { font-size: 11px; color: var(--gold-soft); margin-top: 2px; }
    .hcb-price { font-family: var(--serif); font-size: 20px; font-weight: 700; color: var(--gold-soft); flex-shrink: 0; }
    .old-price { text-decoration: line-through; color: var(--ink-3); font-size: 14px; font-weight: 400; margin-right: 6px; }
    .save-pill {
      display: inline-block; background: rgba(27,122,67,.12); color: var(--success);
      font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 5px;
    }

    .features-strip {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr));
      gap: 16px; padding: 32px 0; border-bottom: 1px solid var(--line);
    }
    .feature-box {
      background: var(--surface); border: 1px solid var(--line-2);
      padding: 18px 20px; border-radius: 14px;
    }
    .feature-icon { font-size: 17px; color: var(--gold-dark); margin-bottom: 6px; }
    .feature-title { font-family: var(--serif); font-size: 16.5px; font-weight: 600; margin: 0 0 5px; }
    .feature-text { font-size: 13px; color: var(--ink-2); line-height: 1.5; margin: 0; }

    /* ---------------- Shop Page & Product Grid ---------------- */
    .section-head {
      display: flex; align-items: flex-end; justify-content: space-between;
      flex-wrap: wrap; gap: 14px; padding: 32px 0 22px;
    }
    .section-eyebrow {
      font-size: 10.5px; letter-spacing: 2px; text-transform: uppercase;
      color: var(--gold-dark); font-weight: 600; margin-bottom: 6px;
    }
    .section-title { font-family: var(--serif); font-size: clamp(24px, 5vw, 32px); font-weight: 600; margin: 0; }
    .section-sub { font-size: 13.5px; color: var(--ink-2); margin: 6px 0 0; line-height: 1.5; }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
      gap: 22px;
    }
    .product-card {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 16px; overflow: hidden; display: flex; flex-direction: column;
      transition: transform .2s, box-shadow .2s;
    }
    .product-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 36px rgba(20,17,14,.08);
    }
    .pc-img-wrap {
      position: relative; height: clamp(250px, 58vw, 320px); background: #14110e; overflow: hidden; cursor: pointer;
    }
    .pc-img-wrap img {
      width: 100%; height: 100%; object-fit: cover; transition: transform .35s ease;
    }
    .product-card:hover .pc-img-wrap img { transform: scale(1.04); }
    .pc-tag {
      position: absolute; top: 12px; left: 12px;
      background: rgba(20,17,14,.84); backdrop-filter: blur(6px);
      color: var(--gold-soft); font-size: 10px; font-weight: 600;
      letter-spacing: 1.1px; text-transform: uppercase;
      padding: 5px 10px; border-radius: 999px; border: 1px solid rgba(180,142,85,.4);
    }
    .pc-scarcity {
      position: absolute; bottom: 12px; right: 12px;
      background: rgba(201,42,42,.92); color: #fff; font-size: 10px; font-weight: 700;
      padding: 4px 9px; border-radius: 6px; letter-spacing: .5px;
    }
    .pc-inbag {
      position: absolute; top: 12px; right: 12px;
      background: var(--success); color: #fff; font-size: 10.5px; font-weight: 700;
      padding: 4px 10px; border-radius: 999px;
    }
    .pc-body { padding: 18px; display: flex; flex-direction: column; flex: 1; }
    .pc-inspiration { font-size: 10.5px; letter-spacing: 1.3px; text-transform: uppercase; color: var(--gold-dark); font-weight: 600; }
    .pc-title {
      font-family: var(--serif); font-size: 20px; font-weight: 600;
      margin: 4px 0 6px; cursor: pointer; color: var(--ink);
    }
    .pc-notes { font-size: 13px; color: var(--ink-2); line-height: 1.55; margin: 0 0 16px; flex: 1; }
    .pc-price-row {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding-top: 12px; border-top: 1px solid var(--line-2); margin-bottom: 14px; flex-wrap: wrap;
    }
    .pc-price { font-family: var(--serif); font-size: 24px; font-weight: 700; color: var(--ink); }
    .pc-actions { display: grid; grid-template-columns: 1fr 1.35fr; gap: 8px; }
    .btn-card-sec {
      padding: 12px 10px; border-radius: 10px; border: 1px solid var(--line);
      background: #fff; color: var(--ink); font-size: 13px; font-weight: 600; cursor: pointer; min-height: 44px;
    }
    .btn-card-sec:hover { border-color: var(--ink); }
    .btn-card-pri {
      padding: 12px 10px; border-radius: 10px; border: none;
      background: var(--ink); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; min-height: 44px;
    }
    .btn-card-pri:hover { background: var(--gold-dark); }

    /* ---------------- Product Detail View ---------------- */
    .detail-wrap { padding: 24px 0; }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      background: none; border: none; color: var(--ink-2); font-size: 13.5px;
      font-weight: 500; cursor: pointer; padding: 6px 0; margin-bottom: 18px; min-height: 38px;
    }
    .back-link:hover { color: var(--ink); }
    .detail-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 36px; align-items: start;
      background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 28px;
    }
    .detail-img {
      width: 100%; height: clamp(260px, 62vw, 420px); object-fit: cover; border-radius: 12px; background: #14110e;
    }
    .p-meta { list-style: none; padding: 0; margin: 18px 0 24px; display: flex; flex-direction: column; gap: 9px; }
    .p-meta li { font-size: 13.5px; color: var(--ink-2); padding-left: 20px; position: relative; }
    .p-meta li::before { content: '✦'; position: absolute; left: 0; color: var(--gold-dark); font-size: 12px; top: 1px; }

    /* ---------------- Checkout Container ---------------- */
    .checkout-container {
      max-width: 660px; margin: 24px auto 0;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 16px; padding: 26px 22px; box-shadow: 0 14px 34px rgba(20,17,14,.05);
    }
    .stepper {
      display: flex; align-items: center; justify-content: center;
      padding-bottom: 18px; margin-bottom: 20px; border-bottom: 1px solid var(--line-2);
      flex-wrap: nowrap; overflow-x: auto; gap: 4px;
    }
    .step { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-3); white-space: nowrap; }
    .step.active { color: var(--ink); font-weight: 600; }
    .step .num {
      width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--ink-3);
      display: flex; align-items: center; justify-content: center; font-size: 10.5px; flex-shrink: 0;
    }
    .step.active .num { background: var(--ink); color: #fff; border-color: var(--ink); }
    .step.done .num { background: var(--gold); border-color: var(--gold); color: #fff; }
    .step-line { width: 18px; height: 1.5px; background: var(--line); margin: 0 4px; flex-shrink: 0; }

    .section-h { font-family: var(--serif); font-size: clamp(20px, 4.5vw, 24px); font-weight: 600; margin: 0 0 16px; }
    .cart-item {
      display: flex; align-items: center; gap: 14px; padding: 14px;
      border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; background: var(--app-bg);
    }
    .ci-thumb-photo { width: 58px; height: 70px; object-fit: cover; border-radius: 8px; flex: 0 0 auto; background: #14110e; }
    .ci-info { flex: 1; min-width: 0; }
    .ci-name { font-size: 14.5px; font-weight: 600; }
    .ci-sub { font-size: 12px; color: var(--ink-2); margin-top: 3px; }
    .qty-controls { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .qty-btn {
      width: 30px; height: 30px; border-radius: 7px; border: 1px solid var(--line);
      background: #fff; color: var(--ink); font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .qty-btn:hover { border-color: var(--ink); }
    .qty-val { font-size: 13.5px; font-weight: 700; min-width: 18px; text-align: center; }
    .ci-price { font-family: var(--serif); font-size: 17px; font-weight: 700; flex-shrink: 0; }

    .upsell-box {
      background: #fdfbf7; border: 1px dashed var(--gold); border-radius: 12px;
      padding: 12px 14px; margin: 14px 0 18px;
    }
    .upsell-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--gold-dark); margin-bottom: 10px; }
    .upsell-list { display: flex; flex-direction: column; gap: 8px; }
    .upsell-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      background: #fff; padding: 8px 12px; border-radius: 9px; border: 1px solid var(--line-2);
    }
    .upsell-name { font-size: 13px; font-weight: 600; }
    .upsell-btn {
      background: var(--ink); color: #fff; border: none; padding: 6px 12px;
      border-radius: 7px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .upsell-btn:hover { background: var(--gold-dark); }

    /* Dark Pattern 2: Low-contrast, muted pre-checked add-on */
    .addon.muted {
      display: flex; align-items: center; gap: 10px; padding: 10px 4px;
      border-bottom: 1px solid var(--line-2); margin-bottom: 14px;
      cursor: pointer; background: transparent; min-height: 44px;
    }
    .addon.muted .checkbox {
      width: 17px; height: 17px; border: 1.5px solid #b8b2a8; border-radius: 4px;
      flex: 0 0 auto; display: flex; align-items: center; justify-content: center;

    .addon.muted .checkbox.checked { background: #9c968c; border-color: #9c968c; }

    .addon.muted .addon-text { font-size: 12px; font-weight: 400; color: #9c968c; flex: 1; line-height: 1.35; }

    .line {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;

    .line.muted-line { color: var(--ink-3); font-style: italic; }

    .dp-line { color: var(--danger); }
    .dp-line span:last-child { color: var(--danger); }
    .total-line {
      border-bottom: none; border-top: 1.5px solid var(--ink);
      margin-top: 6px; padding-top: 14px; font-size: 16px; font-weight: 700;
    }
    .total-line span:last-child { font-family: var(--serif); font-size: 21px; }

    .field { display: block; margin-bottom: 14px; }
    .field span { display: block; font-size: 11px; letter-spacing: .5px; text-transform: uppercase; color: var(--ink-2); margin-bottom: 6px; font-weight: 600; }
    .field input {
      width: 100%; padding: 12px 14px; border: 1px solid var(--line);
      border-radius: 10px; font-size: 16px; font-family: var(--sans); color: var(--ink); background: #fff;
    }
    .field input:focus { outline: none; border-color: var(--gold); }
    .name-hint { font-size: 11.5px; color: var(--gold-dark); margin-top: 4px; display: block; }

    .method, .pay-method {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px; border: 1.5px solid var(--ink); border-radius: 12px; background: var(--app-bg); margin: 12px 0 18px;
    }
    .pm-radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--ink); position: relative; flex-shrink: 0; }
    .pm-radio.checked::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--ink); }
    .pm-info { flex: 1; min-width: 0; }
    .pm-name, .method-name { font-size: 14px; font-weight: 600; }
    .pm-sub, .method-sub { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
    .pm-badge { font-size: 9.5px; font-weight: 700; letter-spacing: .8px; color: var(--gold-dark); border: 1px solid var(--gold); padding: 3px 7px; border-radius: 5px; flex-shrink: 0; }

    .btn-primary {
      width: 100%; padding: 15px; border-radius: 12px; border: none;
      background: var(--ink); color: #fff; font-family: var(--sans);
      font-size: 15px; font-weight: 600; letter-spacing: .3px; cursor: pointer;
      transition: .15s; margin-top: 16px; min-height: 50px;
    }
    .btn-primary:hover { background: var(--gold-dark); }
    .btn-ghost {
      padding: 9px 14px; border-radius: 9px; border: 1px solid rgba(255,255,255,.2); background: transparent;
      color: #e7e3db; font-size: 12.5px; font-weight: 500; cursor: pointer; transition: .15s;

    /* ---------------- Footer ---------------- */

    .telemetry-wrap { background: var(--ws-bg); min-height: calc(100vh - 55px); padding: 24px 16px 60px; color: #f1ede6; }
    .telemetry { max-width: 1180px; margin: 0 auto; }
    .tele-head { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 14px; margin-bottom: 20px; }
    .tele-head h2 { font-family: var(--serif); font-size: clamp(20px, 4.5vw, 26px); font-weight: 600; margin: 0 0 4px; }
    .tele-sub { font-size: 12.5px; color: #9aa0aa; margin: 0; max-width: 640px; line-height: 1.5; }
    .tele-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 22px; }
    .card { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.09); border-radius: 12px; padding: 14px 16px; }
    .card-v { font-family: var(--serif); font-size: 24px; font-weight: 600; color: #f4f0e9; }
    .card-l { font-size: 10px; color: #9aa0aa; letter-spacing: .5px; margin-top: 4px; text-transform: uppercase; }
    .card-warn { border-color: rgba(214,40,40,.5); background: rgba(214,40,40,.1); }
    .card-warn .card-v { color: #f3a5a5; }
    .table-wrap { background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08); border-radius: 12px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .tele-table { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 720px; }
    .tele-table th { text-align: left; padding: 11px 12px; background: rgba(0,0,0,.35); color: #b9bec7; font-size: 10.5px; letter-spacing: .7px; text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,.08); }
    .tele-table td { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,.05); color: #dfe3e9; }
    .grp-B { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: rgba(214,40,40,.25); color: #f0a8a8; }
    .empty { text-align: center; color: #8b9099; padding: 32px; font-style: italic; }

    .blind-exit-wrap { position: fixed; bottom: 14px; right: 14px; z-index: 90; }
    .blind-exit {
      background: rgba(20,17,14,.78); color: rgba(255,255,255,.85); border: 1px solid rgba(255,255,255,.18);
      font-size: 10.5px; padding: 6px 11px; border-radius: 20px; cursor: pointer; backdrop-filter: blur(4px);
    }

    @media (max-width: 820px) {
      .hero-section { grid-template-columns: 1fr; padding: 28px 0 36px; gap: 28px; text-align: center; }
      .hero-desc { margin-left: auto; margin-right: auto; }
      .hero-actions, .hero-stats { justify-content: center; }
      .detail-grid { grid-template-columns: 1fr; padding: 18px; gap: 22px; }
    }

    @media (max-width: 560px) {
      .toolbar { padding: 8px 12px; gap: 8px; }
      .brand-sub, .live-pill { display: none; }
      .tabs { width: 100%; order: 3; margin-left: 0; justify-content: stretch; }
      .tab { flex: 1; text-align: center; padding: 7px 6px; font-size: 11px; }
      .header-inner { padding: 10px 14px; gap: 8px; }
      .site-logo { width: 34px; height: 34px; font-size: 13px; }
      .site-tagline { display: none; }
      .site-nav { gap: 10px; }
      .nav-link { font-size: 13px; padding: 6px 2px; }
      .cart-btn { padding: 7px 11px; font-size: 12px; }
      .site-main { padding: 0 14px 48px; }
      .hero-actions { flex-direction: column; width: 100%; }
      .btn-gold, .btn-outline { width: 100%; text-align: center; justify-content: center; }
      .hero-stats { width: 100%; justify-content: space-around; gap: 10px; }
      .checkout-container { padding: 18px 14px; margin-top: 16px; border-radius: 14px; }
      .pc-actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
  (function(){
    "use strict";

    /* ============================ CATALOG & CONFIG ============================ */
    var PRODUCTS = [
      {
        id: 'hero',
        name: 'SOOVEŔ Bleu Noir',
        subtitle: 'Inspired by Bleu de Chanel · 30 ml',
        tag: 'Flash Offer · 36% OFF',

      },
      {
        id: 'alt1',
        name: 'SOOVEŔ Crimson Desire',
        subtitle: 'Inspired by Dunhill Desire · 30 ml',
        tag: 'Flash Offer · 26% OFF',
        stockText: 'Only 1 bottle left!',
        regularPrice: 700,
        price: 520,
        img: 'alt1.jpg',
        remoteImg: 'https:' + '//www.designarena.ai/u/eb2cc76b-4481-4981-83c2-329655ce78c9',
        notes: 'A bold fragrance of striking contrasts—bergamot, roasted coffee, creamy almond, and patchouli.',
        highlights: ['Regular ৳700 · Flash Offer ৳520', 'Warm spice & tonka bean base', 'Pocket-friendly luxury flacon']
      },
      {
        id: 'alt2',
        name: 'SOOVEŔ Velvet Royale',
        subtitle: 'Inspired by Good Girl · 30 ml',
        tag: 'Flash Offer · 16% OFF',
        stockText: 'High Demand · 2 left',
        regularPrice: 700,
        price: 590,
        img: 'alt2.jpg',
        remoteImg: 'https:' + '//www.designarena.ai/u/a2926828-7ef3-41c9-aab5-d8fc0fad893c',
        notes: 'Luminous jasmine and tuberose layered over dark roasted cocoa, velvet musk, and sweet amber.',
        highlights: ['Regular ৳700 · Flash Offer ৳590', 'Supreme Extrait concentration', 'Crafted in Dhaka']
      }
    ];

    var CONFIG = {
      deliveryFee: 50,
      giftBoxFee: 80,
      platformFee: 25,
      budget: 1200,
      urgencyStart: 170, // 02:50 countdown
      customer: {
        name: '',
        address: 'House 14, Road 7, Dhanmondi, Dhaka',
        phone: '01711-000000'
      }
    };

    /* ============================ STATE & GOOGLE SHEETS ============================ */
    var STORAGE_KEY = 'soover_p2_orders_v5';
    var DEVICE_KEY  = 'soover_p2_device_id';
    var SESSION_KEY = 'soover_p2_active_session_v5';
    var SHEET_URL   = 'var SHEET_URL   = 'https:' //script.google.com/macros/s/AKfycbzyRZr4XKyBet3eNiVJN1aeUVGKI_gesaaFjw-9sRZ6b2xrvs15DDDyReRmoNroRij25A/exec'; 

    var deviceId = '';
    try {
      deviceId = localStorage.getItem(DEVICE_KEY) || '';
      if(!deviceId){
        deviceId = 'DEV-' + Math.random().toString(36).slice(2, 8).toUpperCase();
        localStorage.setItem(DEVICE_KEY, deviceId);
      }
    } catch(e) {
      deviceId = 'DEV-' + Math.random().toString(36).slice(2, 8).toUpperCase();
    }

    var telemetry = [];
    try { telemetry = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch(e) {}

    var sessions = {};
    var view = 'B';
    var blind = false;
    var inspectorOn = true;
    var toastTimer = null;
    var toastText = '';

    /* ============================ HELPERS ============================ */
    function fmt(n){ return '৳' + n; }
    function formatTime(sec){
      var m = Math.floor(sec/60), s = sec%60;
      return (m<10?'0':'') + m + ':' + (s<10?'0':'') + s;
    }
    function esc(str){
      return String(str).replace(/[&<>"]/g, function(c){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
      });
    }
    function getProduct(id){
      for(var i=0; i<PRODUCTS.length; i++){
        if(PRODUCTS[i].id === id) return PRODUCTS[i];
      }
      return PRODUCTS[0];
    }

    function showToast(msg){
      toastText = msg;
      render();
      if(toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function(){
        toastText = '';
        render();
      }, 3200);
    }

    function saveActiveSession(s){
      try { sessionStorage.setItem(SESSION_KEY, JSON.stringify(s)); } catch(e) {}
    }

    function getCartItems(s){
      var cart = s.cart || {};
      var list = [];
      PRODUCTS.forEach(function(p){
        var qty = Number(cart[p.id]) || 0;
        if(qty > 0){
          list.push({ prod: p, qty: qty, subtotal: p.price * qty });
        }
      });
      return list;
    }

    function getCartCount(s){
      return getCartItems(s).reduce(function(sum, it){ return sum + it.qty; }, 0);
    }

    function totals(s){
      var items = getCartItems(s);
      var itemTotal = items.reduce(function(sum, it){ return sum + it.subtotal; }, 0);
      var count = items.reduce(function(sum, it){ return sum + it.qty; }, 0);
      var gift = (count > 0 && s.giftBox) ? CONFIG.giftBoxFee : 0;
      var delivery = count > 0 ? CONFIG.deliveryFee : 0;
      var platform = count > 0 ? CONFIG.platformFee : 0; // Dark Pattern 3: Hidden Service Charge
      var prodSummary = items.map(function(it){
        return it.prod.name.replace('SOOVEŔ ', '') + ' x' + it.qty;
      }).join(', ') || 'No item';
      return {
        items: items,
        count: count,
        item: itemTotal,
        gift: gift,
        delivery: delivery,
        platform: platform,
        total: itemTotal + gift + delivery + platform,
        prodSummary: prodSummary
      };
    }

    // Sends exact 9-column row matching Customer_Transactions:
    // Timestamp | Device_ID | Group | Customer_Name | Product | Final_Bill | Total_Clicks | Elapsed_Sec | Misclicks
    function recordCompletedOrder(s){
      if(s.orderSubmitted) return;
      s.orderSubmitted = true;

      var t = totals(s);
      var elapsedSec = s.startedAt ? Math.max(1, Math.round((Date.now() - s.startedAt) / 1000)) : 1;
      var budgetStatus = t.total > CONFIG.budget ? 'EXCEEDED' : 'WITHIN';
      var customerName = (s.customer.name || '').trim() || 'Anonymous Participant';
      var productCol = t.prodSummary + (s.giftBox ? ' + GiftBox' : '');
      var finalBillCol = 'Final = ' + fmt(t.total) + ' (' + budgetStatus + ')';

      var entry = {
        t: new Date().toISOString(),
        sessionId: s.id,
        group: 'B',
        customerName: customerName,
        product: productCol,
        finalBill: finalBillCol,
        totalClicks: s.totalClicks || 1,
        elapsedSec: elapsedSec,
        misclicks: s.misclicks || 0
      };

      telemetry.push(entry);
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(telemetry)); } catch(e) {}
      saveActiveSession(s);

      if (SHEET_URL && typeof fetch === 'function') {
        fetch(SHEET_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(entry)
        }).catch(function(){});
      }
    }

    function createSession(){
      try {
        var saved = sessionStorage.getItem(SESSION_KEY);
        if(saved){
          var parsed = JSON.parse(saved);
          if(parsed && parsed.prototype === 'B' && parsed.cart) return parsed;
        }
      } catch(e) {}

      return {
        id: deviceId,
        prototype: 'B',
        screen: 0,
        selectedProductId: 'hero',
        cart: {},
        giftBox: true, // Dark Pattern 2: Pre-checked by default in Group B
        customer: { name: CONFIG.customer.name, address: CONFIG.customer.address, phone: CONFIG.customer.phone },
        urgency: CONFIG.urgencyStart,
        startedAt: Date.now(),
        totalClicks: 0,
        misclicks: 0,
        orderSubmitted: false
      };
    }

    function ensureSession(){
      if(!sessions['B']){
        sessions['B'] = createSession();
        saveActiveSession(sessions['B']);
      }
      return sessions['B'];
    }

    function go(s, screen){
      s.screen = screen;
      saveActiveSession(s);
      render();
      if(typeof window !== 'undefined' && window.scrollTo) window.scrollTo(0, 0);
    }

    function startNewSession(s){
      s.screen = 0;
      s.selectedProductId = 'hero';
      s.cart = {};
      s.giftBox = true;
      s.customer = { name: '', address: CONFIG.customer.address, phone: CONFIG.customer.phone };
      s.urgency = CONFIG.urgencyStart;
      s.startedAt = Date.now();
      s.totalClicks = 0;
      s.misclicks = 0;
      s.orderSubmitted = false;
      saveActiveSession(s);
      render();
      if(typeof window !== 'undefined' && window.scrollTo) window.scrollTo(0, 0);
    }

    function callout(n, title, desc){
      if(!inspectorOn) return '';
      return '<div class="dp-callout">'
        + '<div class="dp-tag">Dark Pattern ' + n + '</div>'
        + '<div class="dp-title">' + title + '</div>'
        + '<div class="dp-desc">' + desc + '</div></div>';
    }

    function urgencyBannerHTML(s){
      return '<div class="urgency-banner"><span class="pulse"></span>Flash Offer Ends in <b id="urgency-' + s.id + '">' + formatTime(s.urgency) + '</b> — Order Before Stock Runs Out!</div>';
    }

    /* ============================ PAGES ============================ */
    function renderProductCard(s, p, detailLabel, addLabel){
      var inCartQty = (s.cart && s.cart[p.id]) ? s.cart[p.id] : 0;
      var badge = inCartQty > 0
        ? '<span class="pc-inbag">✓ In Bag (' + inCartQty + ')</span>'
        : '<span class="pc-scarcity">' + esc(p.stockText) + '</span>';
      return '<div class="product-card">'
        + '<div class="pc-img-wrap" data-action="viewProduct" data-product="' + p.id + '">'
        + '<span class="pc-tag">' + esc(p.tag) + '</span>'
        + badge
        + '<img src="' + p.img + '" onerror="this.onerror=null;this.src=\'' + p.remoteImg + '\';" alt="' + esc(p.name) + '" />'
        + '</div>'
        + '<div class="pc-body">'
        + '<div class="pc-inspiration">' + esc(p.subtitle) + '</div>'
        + '<h3 class="pc-title" data-action="viewProduct" data-product="' + p.id + '">' + esc(p.name) + '</h3>'
        + '<p class="pc-notes">' + esc(p.notes) + '</p>'
        + '<div class="pc-price-row">'
        + '<div><span class="old-price">' + fmt(p.regularPrice) + '</span><span class="pc-price">' + fmt(p.price) + '</span></div>'
        + '<span class="save-pill">Save ' + fmt(p.regularPrice - p.price) + '</span>'
        + '</div>'
        + '<div class="pc-actions">'
        + '<button class="btn-card-sec" data-action="viewProduct" data-product="' + p.id + '">' + detailLabel + '</button>'
        + '<button class="btn-card-pri" data-action="addItem" data-product="' + p.id + '">' + (inCartQty > 0 ? '+ Add Another' : addLabel) + '</button>'
        + '</div>'
        + '</div></div>';
    }

    function homeHTML(s){
      var heroProd = PRODUCTS[0];
      var previewCards = PRODUCTS.map(function(p){
        return renderProductCard(s, p, 'Details', '+ Add to Bag');
      }).join('');

      return ''
        + urgencyBannerHTML(s)
        + callout(1, 'Fake Urgency & Scarcity', 'A live red countdown timer and "Only 2 bottles left!" badges manufacture artificial time pressure to rush purchase decisions.')
        + '<section class="hero-section">'
        + '<div>'
        + '<span class="hero-eyebrow">SOOVEŔ · Maison de Parfum · Dhaka</span>'
        + '<h1 class="hero-title">Expressing <em>Royalty</em> in Every Drop.</h1>'
        + '<p class="hero-desc">Handcrafted 30ml Extrait de Parfum collection. Regular price ৳700 — now available at limited flash offer prices starting from ৳450. Mix &amp; match multiple fragrances before the timer expires.</p>'
        + '<div class="hero-actions">'
        + '<button class="btn-gold" data-action="goShop">Claim Offer in Shop →</button>'
        + '<button class="btn-outline" data-action="goCart">View Shopping Bag (' + getCartCount(s) + ')</button>'
        + '</div>'
        + '<div class="hero-stats">'
        + '<div><div class="stat-num">৳450 – ৳590</div><div class="stat-label">Regular ৳700</div></div>'
        + '<div><div class="stat-num">8+ Hours</div><div class="stat-label">Lasting Projection</div></div>'
        + '<div><div class="stat-num">24h</div><div class="stat-label">Dhaka Dispatch</div></div>'
        + '</div>'
        + '</div>'
        + '<div class="hero-visual">'
        + '<div class="hero-card" data-action="viewProduct" data-product="hero" style="cursor:pointer;">'
        + '<img src="' + heroProd.img + '" onerror="this.onerror=null;this.src=\'' + heroProd.remoteImg + '\';" alt="SOOVEŔ Bleu Noir" />'
        + '<div class="hero-card-badge">'
        + '<div><div class="hcb-title">' + esc(heroProd.name) + '</div><div class="hcb-sub">Regular ৳700 · Only 2 left!</div></div>'
        + '<div class="hcb-price">' + fmt(heroProd.price) + '</div>'
        + '</div>'
        + '</div>'
        + '</div>'
        + '</section>'
        + '<section class="features-strip">'
        + '<div class="feature-box"><div class="feature-icon">✦</div><h3 class="feature-title">Flash Offer Discounts</h3><p class="feature-text">Save up to ৳250 per bottle off our ৳700 regular retail price during this flash window.</p></div>'
        + '<div class="feature-box"><div class="feature-icon">✦</div><h3 class="feature-title">Multi-Bottle Bag</h3><p class="feature-text">Combine 1, 2, or all 3 signature perfumes into a single order.</p></div>'
        + '<div class="feature-box"><div class="feature-icon">✦</div><h3 class="feature-title">Instant Mobile Checkout</h3><p class="feature-text">Seamless payment via bKash and Nagad with real-time order confirmation.</p></div>'

    /* ============================ TELEMETRY LOG ============================ */
    function telemetryHTML(){
      var exceeded = telemetry.filter(function(e){ return e.finalBill && e.finalBill.indexOf('EXCEEDED') > -1; }).length;
      function avgBill(arr){
        if(!arr.length) return '—';
        var sum = arr.reduce(function(a,e){
          var m = (e.finalBill || '').match(/Final\s*=\s*৳(\d+)/); return a + (m ? parseInt(m[1],10) : 0);
        },0);
        return fmt(Math.round(sum/arr.length));
      }
      function avgTime(arr){
        if(!arr.length) return '—';
        var sum = arr.reduce(function(a,e){ return a + (Number(e.elapsedSec) || 0); }, 0);
        return Math.round(sum / arr.length) + 's';
      }
      var rows = telemetry.slice().reverse().map(function(e){
        return '<tr><td class="mono">' + e.t + '</td>'
          + '<td class="mono">' + esc(e.sessionId || '—') + '</td>'
          + '<td><span class="grp-B">' + esc(e.group) + '</span></td>'
          + '<td><b>' + esc(e.customerName || '—') + '</b></td>'
          + '<td>' + esc(e.product || '—') + '</td>'
          + '<td class="mono">' + esc(e.finalBill || '—') + '</td>'
          + '<td class="mono"><b>' + (e.totalClicks || 0) + '</b></td>'
          + '<td class="mono"><b>' + (e.elapsedSec || 0) + 's</b></td>'
          + '<td class="mono"><b>' + (e.misclicks || 0) + '</b></td></tr>';
      }).join('');
      return '<div class="telemetry-wrap"><div class="telemetry">'
        + '<div class="tele-head"><div><h2>Prototype 2 Completed Orders Log (Group B · 9-Column Sync)</h2>'
        + '<p class="tele-sub">Synced directly to your Google Sheet (Customer_Transactions) as Group B in the exact 9-column sequence.</p></div>'
        + '<div class="tele-actions"><button class="btn-ghost" data-action="exportCsv">⬇ Export CSV</button>'
        + '<button class="btn-ghost danger" data-action="clearLog">Clear Log</button></div></div>'
        + '<div class="cards">'
        + '<div class="card"><div class="card-v">' + telemetry.length + '</div><div class="card-l">Completed Orders (B)</div></div>'
        + '<div class="card"><div class="card-v">' + avgTime(telemetry) + '</div><div class="card-l">Avg Completion Time</div></div>'
        + '<div class="card ' + (exceeded?'card-warn':'') + '"><div class="card-v">' + exceeded + '</div><div class="card-l">Budget Exceeded (&gt;' + fmt(CONFIG.budget) + ')</div></div>'
        + '<div class="card"><div class="card-v">' + avgBill(telemetry) + '</div><div class="card-l">Avg Order Total (B)</div></div>'
        + '</div>'
        + '<div class="table-wrap"><table class="tele-table"><thead><tr>'
        + '<th>Timestamp</th><th>Device_ID</th><th>Group</th><th>Customer_Name</th><th>Product</th><th>Final_Bill</th><th>Total_Clicks</th><th>Elapsed_Sec</th><th>Misclicks</th></tr></thead><tbody>'
        + (rows || '<tr><td colspan="9" class="empty">No completed orders yet. Complete an order to log 1 summary row as Group B.</td></tr>')
        + '</tbody></table></div></div></div>';
    }

    function csvCell(v){
      v = String(v);
      return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
    }
    function exportCsv(){
      var header = ['Timestamp','Device_ID','Group','Customer_Name','Product','Final_Bill','Total_Clicks','Elapsed_Sec','Misclicks'];
      var lines = [header].concat(telemetry.map(function(e){
        return [e.t, e.sessionId || '', e.group, e.customerName || '', e.product || '', e.finalBill || '', e.totalClicks || 0, e.elapsedSec || 0, e.misclicks || 0];
      }));
      var csv = lines.map(function(r){ return r.map(csvCell).join(','); }).join('\n');
      var blob = new Blob(['\uFEFF' + csv], { type:'text/csv;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'soover-prototype2-groupB-orders.csv';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    /* ============================ ACTIONS ============================ */
    function handleAction(action, el){
      var s = ensureSession();
      var prodId = el.dataset && el.dataset.product ? el.dataset.product : null;

      if(s.screen !== 5 && ['toggleInspector','exitBlind','exportCsv','clearLog'].indexOf(action) === -1){
        s.totalClicks = (s.totalClicks || 0) + 1;
        saveActiveSession(s);
      }

      switch(action){
        case 'toggleInspector':
          inspectorOn = !inspectorOn;
          render(); break;
        case 'exitBlind':
          blind = false; inspectorOn = true; render(); break;
        case 'exportCsv': exportCsv(); break;
        case 'clearLog':
          telemetry.length = 0;
          try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
          render(); break;
        case 'goHome':
          go(s, 0); break;
        case 'goShop':
          go(s, 1); break;
        case 'goCart':
          go(s, 2); break;
        case 'viewProduct':
          if(prodId) s.selectedProductId = prodId;
          go(s, 6); break;
        case 'addItem':
          var targetId = prodId || s.selectedProductId || 'hero';
          s.cart = s.cart || {};
          s.cart[targetId] = (Number(s.cart[targetId]) || 0) + 1;
          saveActiveSession(s);
          var addedProd = getProduct(targetId);
          if(s.screen === 2){
            render();
          } else {
            showToast('✓ Added ' + addedProd.name + ' (' + getCartCount(s) + ' in bag)');
          }
          break;
        case 'incQty':
          if(prodId){
            s.cart = s.cart || {};
            s.cart[prodId] = (Number(s.cart[prodId]) || 0) + 1;
            saveActiveSession(s);
            render();
          }
          break;
        case 'decQty':
          if(prodId && s.cart && s.cart[prodId]){
            s.cart[prodId] = Math.max(0, Number(s.cart[prodId]) - 1);
            if(s.cart[prodId] === 0) delete s.cart[prodId];
            saveActiveSession(s);
            render();
          }
          break;
        case 'toggleGiftBox':
          s.giftBox = !s.giftBox;
          saveActiveSession(s);
          render(); break;
        case 'proceedCheckout':
          if(getCartCount(s) === 0){ go(s, 1); return; }
          go(s, 3); break;
        case 'continuePayment':
          if(!(s.customer.name || '').trim()){
            var nameInput = document.getElementById('cust-name-input');
            if(nameInput){
              nameInput.style.borderColor = '#c92a2a';
              nameInput.focus();
              return;
            }
          }
          go(s, 4); break;
        case 'completeOrder':
          recordCompletedOrder(s);
          go(s, 5); break;
        case 'startNewSession':
          startNewSession(s); break;
      }
    }

    function render(){
      var app = document.getElementById('app');
      app.innerHTML = blind ? blindLayout() : researcherLayout();
    }

    function init(){
      var params = new URLSearchParams(window.location.search);
      var blindParam = params.get('blind') === '1';
      view = 'B';
      blind = blindParam;
      inspectorOn = !blind;

      document.addEventListener('click', function(e){
        var a = e.target.closest('[data-action]');
        if(a){ handleAction(a.dataset.action, a); return; }
        var v = e.target.closest('[data-view]');
        if(v){ view = v.dataset.view; render(); return; }
        var w = e.target.closest('.site-main');
        if(w && !e.target.closest('button, input, label, a, [data-action]')){
          var s = ensureSession();
          if(s && s.screen !== 5){
            s.totalClicks = (s.totalClicks || 0) + 1;
            s.misclicks = (s.misclicks || 0) + 1;
            saveActiveSession(s);
            if(!blind) render();
          }
        }
      });

      document.addEventListener('input', function(e){
        var f = e.target.closest('[data-field]');
        if(!f) return;
        var s = ensureSession();
        s.customer[f.dataset.field] = f.value;
        f.style.borderColor = '';
        saveActiveSession(s);
      });

      setInterval(function(){
        var s = sessions['B'];
        if(s && s.screen !== 5){
          s.urgency = s.urgency > 0 ? s.urgency - 1 : CONFIG.urgencyStart;
          var el = document.getElementById('urgency-' + s.id);
          if(el) el.textContent = formatTime(s.urgency);
        }
      }, 1000);

      render();
    }

    if(document.readyState === 'loading'){
      document.addEventListener('DOMContentLoaded', init);
    } else { init(); }
  })();
  </script>
</body>
</html>
